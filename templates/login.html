<!DOCTYPE html>
<html>
<head>
    <title>Student Cloud Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card mx-auto p-4 shadow" style="max-width:400px">
        <h3 class="text-center">Student Cloud</h3>
        <p class="text-center text-muted">Document Management System</p>
        {% for message in get_flashed_messages() %}
        <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
        <form method="POST">
            <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
            <input class="form-control mb-3" name="identifier" placeholder="Username, email, or phone" required>
            <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
            <button class="btn btn-primary w-100">Login</button>
        </form>

        <hr class="my-4">

        <h5 class="mb-3">Set password with OTP</h5>
        <form method="POST" action="{{ url_for('request_otp') }}">
            <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
            <input class="form-control mb-3" name="username" placeholder="Username" required>
            <select class="form-select mb-3" name="contact_type">
                <option value="email">Email</option>
                <option value="phone">Phone Number</option>
            </select>
            <input class="form-control mb-3" name="contact_value" placeholder="your@email.com or +1234567890" required>
            <button class="btn btn-outline-secondary w-100">Send OTP</button>
        </form>

        <form method="POST" action="{{ url_for('set_password') }}" class="mt-3">
            <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
            <input class="form-control mb-3" name="username" placeholder="Username" required>
            <select class="form-select mb-3" name="contact_type">
                <option value="email">Email</option>
                <option value="phone">Phone Number</option>
            </select>
            <input class="form-control mb-3" name="contact_value" placeholder="Email or phone used above" required>
            <input class="form-control mb-3" name="otp" placeholder="Enter OTP" required>
            <input class="form-control mb-3" type="password" name="password" placeholder="New password" required>
            <button class="btn btn-success w-100">Set Password & Login</button>
        </form>
    </div>
</div>
</body>
</html>
